# For a host that already runs an HTTPS reverse proxy.
services:
  relay:
    image: kitty-remote:0.1.0
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      KR_ORIGIN: https://${DOMAIN:?Set DOMAIN in deploy/.env}
      KR_DATABASE: /data/relay.sqlite3
      KR_DEV: "0"
    volumes:
      - relay-data:/data
    ports:
      - "127.0.0.1:18765:8765"
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
volumes:
  relay-data:
